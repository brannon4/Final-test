services:
  - type: web
    name: pick-profit-ma-private
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.enableCORS true --server.enableXsrfProtection true
    healthCheckPath: /_stcore/health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.11
